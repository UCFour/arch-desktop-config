config_version = 14

[bar.main]
border = "hover"
capsule = true
capsule_fill = "on_surface_variant"
capsule_opacity = 0.099999997764825821
capsule_padding = 8.0
capsule_radius = 8
end = [ "cpu-temp", "gpu-temp", "brightness", "bluetooth", "notifications", "clipboard", "session" ]
font_family = "Geist"
font_scale = 1.1499999999999999
layer = "overlay"
margin_ends = 500
start = [ "launcher", "workspaces", "active_window", "media" ]
thickness = 38
widget_spacing = 7

[brightness]
enable_ddcutil = true

[dock]
active_monitor_only = false
active_opacity = 1.0
active_scale = 1.1200000000000001
auto_hide = false
background_opacity = 0.54999998770654202
border_width = 0.0
cross_axis_padding = 9
enabled = true
icon_size = 44
inactive_opacity = 1.0
inactive_scale = 0.95999999999999996
item_spacing = 6
launcher_icon = "sparkles"
launcher_position = "start"
magnification = true
magnification_scale = 1.45
main_axis_padding = 14
margin_edge = 12
margin_ends = 0
monitors = []
pinned = [
    "org.gnome.Nautilus",
    "firefox",
    "kitty",
    "org.localsend.localsend_app",
    "dev.noctalia.Noctalia",
    "obsidian",
    "code",
    "spotify-launcher"
]
position = "bottom"
radius = 22
shadow = true
show_dots = true
show_instance_count = true
show_running = true

[location]
auto_locate = true

[lockscreen]
fingerprint = false

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-3" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 196.0
    box_width = 810.0
    cx = 1747.0
    cy = 1202.0
    output = "DP-3"
    placement_height = 1440.0
    placement_width = 3440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_variant"
        background_opacity = 0.34999999999999998
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
font_family = "Geist"
lang = "en"
screen_time_enabled = true

[system.monitor]
cpu_poll_seconds = 2.0
gpu_poll_seconds = 5.0

[theme]
builtin = "Catppuccin"
community_palette = "Vesper"
custom_palette = "4nzt623-dys"
shell_mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-fruit-salad"

    [theme.templates]
    enable_community_templates = false

[wallpaper.default]
path = "/home/kay/Pictures/g8xggiljhxnh1.jpeg"

[wallpaper.last]
path = "/home/kay/Pictures/g8xggiljhxnh1.jpeg"

[wallpaper.monitors.DP-3]
path = "/home/kay/Pictures/g8xggiljhxnh1.jpeg"

[widget.active_window]
display = "icon_only"
icon_size = 20
max_length = 32
min_length = 32
show_empty_label = false

[widget.bluetooth]
scale = 1.05

[widget.brightness]
scale = 1.0800000000000001
show_label = false

[widget.clipboard]
scale = 1.1000000000000001

[widget.clock]
format = "{:%H:%M:%S} - {:%a} - {:%b %d}"
scale = 0.90000000000000002

[widget.cpu-temp]
glyph = "cpu"
glyph_position = "before"
highlight_color = "#ef70b7"
label_min_width = 38
label_show_units = true
scale = 0.88
show_glyph = true
show_value = true
stat = "cpu_temp"
type = "sysmon"
visualization = "none"

[widget.gpu-temp]
glyph = "device-desktop"
glyph_position = "before"
highlight_color = "#ef70b7"
label_min_width = 38
label_show_units = true
scale = 0.88
show_glyph = true
show_value = true
stat = "gpu_temp"
type = "sysmon"
visualization = "none"

[widget.launcher]
glyph = "menu-2"
scale = 1.05

[widget.media]
hide_when_no_media = true

[widget.notifications]
scale = 1.0800000000000001

[widget.session]
glyph = "power"
scale = 1.0800000000000001

[widget.workspaces]
active_pill_size = 2.1000000000000001
capsule_radius = 99
change_color_on_hover = false
empty_color = "#61752B"
focused_color = "#DFFF5F"
focused_output_only = false
hide_when_empty = false
inactive_pill_size = 1.0
labels_only_when_occupied = false
occupied_color = "#9FBE3F"
pill_scale = 0.84999999999999998
show_all_outputs = false
show_icons = false
show_labels = false
style = "regular"
urgent_color = "#ff5370"